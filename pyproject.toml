[project]
name = "meine-stadt-transparent"
version = "0.2.14"
description = "A website to bring municipal politics to citizens"
authors = [
    { name = "Tobias Hößl", email = "tobias@hoessl.eu" },
    { name = "Konstantin Schütze", email = "konstin@mailbox.org" },
]
license = { file = "license" }
readme = "Readme.md"
requires-python = ">=3.8,<4.0"
dependencies = [
    "Django>=4.1.1,<4.2.0",
    "PyPDF2[crypto]>=3.0.0,<4.0.0",
    "Wand>=0.6.0,<0.7.0",
    "django-allauth>=0.53,<0.54",
    "django-anymail[mailjet,sendgrid]>=9.0,<10.0",
    "django-decorator-include>=2.1,<4.0",
    "django-elasticsearch-dsl>=7.1,<7.4",
    "django-environ>=0.10.0,<0.11.0",
    "django-geojson>=3.0,<4.0",
    "django-q[sentry]>=1.3.9,<2.0.0",
    "django-settings-export>=1.2,<2.0",
    "django-simple-history>=3.0,<4.0",
    "django-webpack-loader>=1.8.0,<1.9.0",
    "django-widget-tweaks>=1.4,<2.0",
    "django-csp>=3.4,<4.0",
    "elasticsearch==7.17.13",
    "elasticsearch-dsl>=7.3,<8.0",
    "geoextract>=0.3.1,<0.4.0",
    "geopy>=2.0.0,<3.0.0",
    "gunicorn>=20.0,<21.0",
    "html2text>=2019.8,<2021.0",
    "icalendar>=5.0.4,<6.0.0",
    "jsonfield>=3.1,<4.0",
    "minio>=5,<8",
    "osm2geojson>=0.2.0,<0.3.0",
    "psycopg2>=2.9.3,<3.0.0; sys_platform != 'darwin'",
    "psycopg2-binary>=2.9.3,<3.0.0; sys_platform == 'darwin'",
    "python-dateutil>=2.7,<3.0",
    "python-slugify>=8.0.0,<9.0.0",
    "requests>=2.22,<3.0",
    "sentry-sdk>=1.0.0,<2.0.0",
    "splinter>=0.19,<0.20",
    "tqdm>=4.29,<5.0",
    "wagtail>=4.2.1,<4.3.0",
]

[dependency-groups]
dev = [
    "black[d]>=23.3.0,<24.0.0",
    "django-debug-toolbar>=3.0,<4.0",
    "pytest-django>=4.1,<5.0",
    "responses>=0.23.0,<0.24.0",
    "selenium==4.8.2",
    "tox>=4.2.3,<5.0.0",
    "ruff==0.0.263",
]

[project.optional-dependencies]
pgp = ["pgpy>=0.6.0,<0.7.0"]
import-json = ["cattrs>=22.1.0,<23.0.0"]
mysql = ["mysqlclient>=1.3,<3.0"]

[project.scripts]
mst-manage = 'manage:main'

[tool.black]
extend-exclude = '''
/(
  | mainapp/migrations
  | cms/migrations
  | importer/migrations
)/
'''

[tool.ruff]
ignore = ["E501"]
extend-exclude = ["etc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["manage"]

[tool.setuptools.packages.find]
include = ["cms*", "importer*", "mainapp*", "meine_stadt_transparent*"]

[tool.setuptools.package-data]
mainapp = ["assets/bundles/**/*"]
