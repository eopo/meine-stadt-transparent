name: Dependency Check

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Export locked requirements
        run: uv export --locked --no-dev --all-extras --output-file requirements-audit.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt
          require-hashes: true