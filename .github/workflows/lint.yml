name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: psf/black@stable
        with:
          use_pyproject: true
          options: "--check --diff"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .

  quality-gate:
    name: Lint OK
    runs-on: ubuntu-latest
    needs: [black, ruff]
    if: always()
    steps:
      - run: test "${{ needs.black.result }}" = success && test "${{ needs.ruff.result }}" = success
