name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  black-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - uses: psf/black@stable

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        run: ruff .

  # Single stable check name for branch protection, independent of individual lint jobs.
  lint-result:
    name: Lint OK
    runs-on: ubuntu-latest
    needs: [ black-format, ruff ]
    if: always()
    steps:
      - name: Check lint jobs result
        run: |
          test "${{ needs['black-format'].result }}" = "success"
          test "${{ needs.ruff.result }}" = "success"
