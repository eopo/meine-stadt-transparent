name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev poppler-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: uv sync --locked --extra import-json
      - name: Test migrations
        run: ENV_PATH=etc/test.env uv run python ./manage.py migrate
      - name: Build assets
        run: npm run build:prod && npm run build:dev
      - name: Run tests
        run: ENV_PATH=etc/test.env uv run pytest

  test-result:
    name: Tests OK
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = success
